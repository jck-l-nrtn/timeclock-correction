AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Montane Packaging Timeclock — App Runner (from GitHub) + Aurora Serverless v2
  (PostgreSQL, scale-to-zero). All-AWS, single region (us-east-1).

Parameters:
  GitHubConnectionArn:
    Type: String
    Description: >
      ARN of the App Runner GitHub connection (create it once in the App Runner
      console → GitHub connections, authorize the repo, copy the ARN).
  RepositoryUrl:
    Type: String
    Default: https://github.com/jck-l-nrtn/timeclock-correction
  Branch:
    Type: String
    Default: main
  AppDomain:
    Type: String
    Default: https://staff.montanepm.com
    Description: Public URL the app will be served at (used for links + cookies).

  DBMasterPassword:
    Type: String
    NoEcho: true
    MinLength: 12
    Description: Aurora master password. Use URL-safe characters (A-Z a-z 0-9 - _ .).

  JibbleClientId:
    Type: String
  JibbleClientSecret:
    Type: String
    NoEcho: true
  SessionSecret:
    Type: String
    NoEcho: true
    Description: Random string for signing session cookies.
  ResendApiKey:
    Type: String
    NoEcho: true
    Description: Resend API key (re_...). Used as the SMTP password.
  EmailFrom:
    Type: String
    Default: onboarding@resend.dev
  NotifyEmailTo:
    Type: String
    Description: Where new-request alerts and the weekly report are sent.
  ReportToken:
    Type: String
    NoEcho: true
    Description: Secret the weekly scheduler passes to the report endpoint.

Resources:
  # ---- Networking (minimal public VPC for the DB) ------------------------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: montane-timeclock }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttach
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  SubnetARoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubnetA, RouteTableId: !Ref RouteTable }
  SubnetBRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubnetB, RouteTableId: !Ref RouteTable }

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Postgres access (SSL + credentials enforced by the app)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 0.0.0.0/0

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Timeclock Aurora subnets
      SubnetIds: [!Ref SubnetA, !Ref SubnetB]

  # ---- Aurora Serverless v2 (PostgreSQL, scale-to-zero) ------------------
  DBCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      Engine: aurora-postgresql
      EngineVersion: "16.4"
      DatabaseName: timeclock
      MasterUsername: postgres
      MasterUserPassword: !Ref DBMasterPassword
      DBSubnetGroupName: !Ref DBSubnetGroup
      VpcSecurityGroupIds: [!Ref DBSecurityGroup]
      StorageEncrypted: true
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0 # scale to zero when idle (adds ~15s cold start)
        MaxCapacity: 2

  DBInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: aurora-postgresql
      DBClusterIdentifier: !Ref DBCluster
      DBInstanceClass: db.serverless
      PubliclyAccessible: true

  # ---- App Runner (builds + runs the app from GitHub) --------------------
  AppRunner:
    Type: AWS::AppRunner::Service
    DependsOn: DBInstance
    Properties:
      ServiceName: montane-timeclock
      SourceConfiguration:
        AutoDeploymentsEnabled: true
        AuthenticationConfiguration:
          ConnectionArn: !Ref GitHubConnectionArn
        CodeRepository:
          RepositoryUrl: !Ref RepositoryUrl
          SourceCodeVersion:
            Type: BRANCH
            Value: !Ref Branch
          CodeConfiguration:
            ConfigurationSource: API
            CodeConfigurationValues:
              Runtime: NODEJS_18
              BuildCommand: "npm install --include=dev && npm run build"
              StartCommand: "npm run db:push --workspace apps/api -- --skip-generate && npm start"
              Port: "8080"
              RuntimeEnvironmentVariables:
                - { Name: NODE_ENV, Value: production }
                - { Name: PORT, Value: "8080" }
                - { Name: WEB_ORIGIN, Value: !Ref AppDomain }
                - { Name: DEV_LOGIN_ENABLED, Value: "false" }
                - { Name: JIBBLE_ORG_TIMEZONE, Value: America/Denver }
                - { Name: ORG_NAME, Value: Montane Packaging }
                - Name: DATABASE_URL
                  Value: !Sub "postgresql://postgres:${DBMasterPassword}@${DBCluster.Endpoint.Address}:5432/timeclock?sslmode=require"
                - { Name: JIBBLE_CLIENT_ID, Value: !Ref JibbleClientId }
                - { Name: JIBBLE_CLIENT_SECRET, Value: !Ref JibbleClientSecret }
                - { Name: SESSION_SECRET, Value: !Ref SessionSecret }
                - { Name: SMTP_HOST, Value: smtp.resend.com }
                - { Name: SMTP_PORT, Value: "587" }
                - { Name: SMTP_USER, Value: resend }
                - { Name: SMTP_PASS, Value: !Ref ResendApiKey }
                - { Name: EMAIL_FROM, Value: !Ref EmailFrom }
                - { Name: NOTIFY_EMAIL_TO, Value: !Ref NotifyEmailTo }
                - { Name: REPORT_TOKEN, Value: !Ref ReportToken }
      InstanceConfiguration:
        Cpu: "256" # 0.25 vCPU
        Memory: "512" # 0.5 GB
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: /api/health

Outputs:
  AppUrl:
    Description: Default App Runner URL (add the custom domain after)
    Value: !Sub "https://${AppRunner.ServiceUrl}"
  DatabaseEndpoint:
    Value: !GetAtt DBCluster.Endpoint.Address
