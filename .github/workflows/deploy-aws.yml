name: Deploy to AWS

# Builds the Lambda container image, deploys the CloudFormation stack, and
# publishes the React app to S3 + CloudFront.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY   (an IAM user allowed to deploy)
#   JIBBLE_CLIENT_ID, JIBBLE_CLIENT_SECRET, SESSION_SECRET,
#   RESEND_API_KEY, EMAIL_FROM, NOTIFY_EMAIL_TO, REPORT_TOKEN, WEB_ORIGIN

on:
  workflow_dispatch: {}
  # Add a push trigger once AWS secrets are configured:
  # push:
  #   branches: [main]

env:
  AWS_REGION: us-east-1
  STACK: montane-timeclock
  ECR_REPO: montane-timeclock

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build & push Lambda image to ECR
        id: image
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="$ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com"
          aws ecr describe-repositories --repository-names "$ECR_REPO" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$ECR_REPO" >/dev/null
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
          URI="$REGISTRY/$ECR_REPO:${GITHUB_SHA::12}"
          docker build -f Dockerfile.lambda -t "$URI" .
          docker push "$URI"
          echo "uri=$URI" >> "$GITHUB_OUTPUT"

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --stack-name "$STACK" \
            --template-file aws/template.yaml \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              ImageUri="${{ steps.image.outputs.uri }}" \
              WebOrigin="${{ secrets.WEB_ORIGIN }}" \
              JibbleClientId="${{ secrets.JIBBLE_CLIENT_ID }}" \
              JibbleClientSecret="${{ secrets.JIBBLE_CLIENT_SECRET }}" \
              SessionSecret="${{ secrets.SESSION_SECRET }}" \
              ResendApiKey="${{ secrets.RESEND_API_KEY }}" \
              EmailFrom="${{ secrets.EMAIL_FROM }}" \
              NotifyEmailTo="${{ secrets.NOTIFY_EMAIL_TO }}" \
              ReportToken="${{ secrets.REPORT_TOKEN }}"

      - name: Point the Lambda at the new image
        run: |
          FN=$(aws cloudformation describe-stack-resource --stack-name "$STACK" \
                --logical-resource-id Fn --query StackResourceDetail.PhysicalResourceId --output text)
          aws lambda update-function-code --function-name "$FN" \
            --image-uri "${{ steps.image.outputs.uri }}" >/dev/null
          aws lambda wait function-updated --function-name "$FN"

      - name: Build the web app
        run: |
          npm ci
          npm run build:shared
          npm run build --workspace @timesheet/web

      - name: Publish web to S3 + invalidate CloudFront
        run: |
          BUCKET=$(aws cloudformation describe-stacks --stack-name "$STACK" \
                    --query "Stacks[0].Outputs[?OutputKey=='WebBucketName'].OutputValue" --output text)
          DIST=$(aws cloudformation describe-stacks --stack-name "$STACK" \
                    --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)
          aws s3 sync apps/web/dist "s3://$BUCKET" --delete
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/*" >/dev/null
          echo "Deployed. App: $(aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='CloudFrontUrl'].OutputValue" --output text)"
